name: CI-CD

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/LoanApproval.Tests/LoanApproval.Tests.csproj --configuration Release --no-build

      # The React app is built before `dotnet publish` so Vite's output - which
      # vite.config.ts writes to src/LoanApproval.Api/wwwroot - is included in the
      # published package by the Web SDK. No Node process runs in Azure; the API
      # serves the built assets as static files.
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install front-end dependencies
        run: npm ci
        working-directory: web

      - name: Build front end
        run: npm run build
        working-directory: web

      - name: Publish
        if: github.ref == 'refs/heads/master'
        run: dotnet publish src/LoanApproval.Api/LoanApproval.Api.csproj -c Release -o ./publish

      - name: Deploy to Azure Web App
        if: github.ref == 'refs/heads/master'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'loan-approval-app'          # <-- update to your App Service name
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
