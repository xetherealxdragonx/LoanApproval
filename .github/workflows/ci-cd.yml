name: CI-CD

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/LoanApproval.Tests/LoanApproval.Tests.csproj --configuration Release --no-build

      - name: Publish
        if: github.ref == 'refs/heads/master'
        run: dotnet publish src/LoanApproval.Api/LoanApproval.Api.csproj -c Release -o ./publish

      - name: Deploy to Azure Web App
        if: github.ref == 'refs/heads/master'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'loan-approval-app'          # <-- update to your App Service name
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
